name: Node CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run app
        run: node app.js

      - name: Build Docker
        run: docker build -t my-node-app .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Step
        run: echo "🚀 Deploying app to server..."
